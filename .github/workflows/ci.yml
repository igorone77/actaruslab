# Regression guard for the MODEL AUTOPSY engine.
#
# Runs the full BACE-1 audit and asserts the headline numbers still land
# where the README claims. If a change to featurisation, splitting or the
# model moves them, this fails loudly rather than silently.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  bace-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # httpx backs fastapi's TestClient, which tests/test_job_lifecycle.py
          # needs to drive the app over HTTP with a cookie jar. Test-only, so
          # it stays out of requirements.txt and the container image.
          pip install -r requirements.txt pytest httpx

      - name: BACE-1 regression audit + surface smoke
        run: pytest tests/ -v -s

      - name: API smoke — service boots and answers
        run: |
          uvicorn autopsy.api:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health | grep -q '"status":"ok"'

      # The tier split over real HTTP, with FastAPI resolving the dependency
      # for itself. The unit tests hand `sub` to the endpoints directly, so
      # they cannot catch a paywall dependency that stops returning None or a
      # view that leaks once the response is actually serialised. This is the
      # deployed configuration — no key, no flag — asserted end to end.
      - name: Free tier — an audit runs with no key and returns the verdict only
        run: |
          head -n 201 tests/data/alogp_500.csv > /tmp/smoke.csv
          SUBMIT=$(curl -sf -X POST http://127.0.0.1:8000/autopsy/jobs \
            -F "file=@/tmp/smoke.csv" -F "smiles=smiles" -F "y=AlogP" -F "k=3")
          echo "$SUBMIT"
          JID=$(python -c "import json,sys;print(json.loads(sys.argv[1])['job_id'])" "$SUBMIT")
          TOK=$(python -c "import json,sys;print(json.loads(sys.argv[1])['job_token'])" "$SUBMIT")

          # someone without the token gets the same answer as for a job that
          # never existed, paywall or no paywall
          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8000/autopsy/jobs/$JID)" = "404"

          for _ in $(seq 1 90); do
            OUT=$(curl -sf -H "X-Job-Token: $TOK" http://127.0.0.1:8000/autopsy/jobs/$JID)
            echo "$OUT" | grep -q '"status":"done"' && break
            echo "$OUT" | grep -q '"status":"failed"' && { echo "$OUT"; exit 1; }
            sleep 2
          done
          echo "$OUT"
          python - "$OUT" <<'PY'
          import json, sys
          job = json.loads(sys.argv[1])
          assert job["status"] == "done", job
          res = job["result"]
          assert res["tier"] == "free", res
          assert isinstance(res["inflation_pct"], int), res
          assert set(res) == {"tier", "inflation_pct", "inflation_basis",
                              "inflation_state", "warnings", "contact"}, sorted(res)
          raw = json.dumps(job)
          for leaked in ("ladder", "readout", "specimen", "headline",
                         "lookup_pct_of_reported", "permutation_floor"):
              assert leaked not in raw, f"{leaked} reached the free response"
          assert "actaruslab@proton.me" in res["contact"]["message"]
          assert f"+{res['inflation_pct']}%" in res["contact"]["message"]
          print("free tier ok:", res["inflation_pct"], "%", res["inflation_basis"])
          PY
